services:
  db:
    image: postgres:18
    container_name: aureonweb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aureon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: aureonweb_booking
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: